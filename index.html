<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrimba Challenge</title>
  <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="index.css" />
</head>

<body class="contact-page">
  <header>
    <nav aria-label="Main Menu">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <!-- Form section -->
    <section class="contact-form-section" aria-labelledby="contact-heading">
      <form>
        <h1 class="contact-form-heading">Reach <mark>Out</mark></h1>
        <p id="form-instructions" class="contact-form-intro">
          Curious about something? Complete these fields and "get in touch",
          as you humans say. <wbr aria-hidden="true">🤙</wbr>
        </p>
        <label for="name"> Full Name</label>
        <input required class="contact-input" id="name" type="text" placeholder="Joe Louis" aria-required="true"
          autocomplete="name" />
        <label for="email">Email</label>
        <input required class="contact-input" id="email" type="email" placeholder="joseph@provider.com" />
        <label for="message">Message</label>
        <textarea class="contact-textarea" id="message" rows="4" cols="50" placeholder="Your message..."
          aria-describedby="form-instructions"></textarea>
        <output id="form-status" role="status" aria-live="polite" for="name email message">
        </output>

        <button class="contact-submit-button" type="submit" onclick="submitForm()">
          Send Message <wbr aria-hidden="true">🎉</wbr>
        </button>

      </form>
      <img class="contact-image" src="images/connect_.png" alt="Connecting dots , symbolizing human connection." />
    </section>
  </main>
  <footer>
    <p>&copy; 2025 My Website</p>

  </footer>
</body>

</html>
